<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой IP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 4px 0 8px; }
  .ip { font: 600 26px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; margin: 0 0 4px; }
  .sub { color: var(--hint); font-size: 13px; margin-bottom: 18px; }
  .card { background: var(--card); border-radius: 12px; padding: 4px 14px; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid color-mix(in srgb, var(--hint) 25%, transparent); }
  .row:last-child { border-bottom: 0; }
  .row span:first-child { color: var(--hint); flex-shrink: 0; }
  .row span:last-child { text-align: right; word-break: break-word; }
  .note { color: var(--hint); font-size: 12px; }
  .err { color: #d93025; }
  button#send {
    display: none; width: 100%; padding: 13px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-text); font-size: 15px; font-weight: 600;
  }
</style>
</head>
<body>
  <h1>Ваш IP глазами сайтов</h1>
  <div id="ip4" class="ip">Определяю…</div>
  <div id="ip6" class="sub"></div>

  <div id="details" class="card" style="display:none"></div>

  <button id="send">Отправить в бота для подробного отчёта</button>
  <p class="note">Адрес определяется запросом прямо с этого устройства, поэтому учитываются VPN и прокси, если они включены.</p>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const result = { ipv4: null, ipv6: null };
const isIP = s => typeof s === "string" && /^[0-9a-f.:]+$/i.test(s.trim()) && (s.includes(".") || s.includes(":"));

async function fetchText(url, ms = 10000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.text();
  } catch (e) {
    throw new Error(e.name === "AbortError" ? "таймаут" : (e.message || "ошибка"));
  } finally { clearTimeout(t); }
}

// Сервисы на разных доменах: если VPN/блокировщик закроет часть из них, сработают другие.
const json = key => txt => JSON.parse(txt)[key];
const trace = txt => (txt.match(/^ip=(.+)$/m) || [])[1];
const plain = txt => txt.trim();
const PROVIDERS = [
  ["cloudflare.com", "https://www.cloudflare.com/cdn-cgi/trace", trace],
  ["ipify.org",      "https://api64.ipify.org?format=json",      json("ip")],
  ["ipwho.is",       "https://ipwho.is/",                         json("ip")],
  ["icanhazip.com",  "https://icanhazip.com/",                    plain],
  ["1.1.1.1",        "https://1.1.1.1/cdn-cgi/trace",             trace],
  ["ipapi.co",       "https://ipapi.co/json/",                    json("ip")],
  ["geojs.io",       "https://get.geojs.io/v1/ip.json",           json("ip")],
  ["ipinfo.io",      "https://ipinfo.io/json",                    json("ip")],
  ["seeip.org",      "https://api.seeip.org/jsonip",              json("ip")],
  ["freeipapi.com",  "https://free.freeipapi.com/api/json",       json("ipAddress")],
];
const V4_ONLY = [
  ["ipify.org v4",     "https://api.ipify.org?format=json", json("ip")],
  ["icanhazip.com v4", "https://ipv4.icanhazip.com/",       plain],
];

const failures = [];
function ask([name, url, parse]) {
  return fetchText(url).then(txt => {
    const ip = (parse(txt) || "").trim();
    if (!isIP(ip)) throw new Error("непонятный ответ");
    return ip;
  }).catch(e => { failures.push(`${name}: ${e.message}`); throw e; });
}

function row(label, value) {
  if (value === undefined || value === null || value === "" || value === "undefined") return "";
  const esc = String(value).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  return `<div class="row"><span>${label}</span><span>${esc}</span></div>`;
}

async function geoSummary(ip) {
  const sources = [
    async () => { const d = JSON.parse(await fetchText("https://ipwho.is/" + ip)); if (!d.success) throw 0;
      const c = d.connection || {};
      return { country: `${(d.flag && d.flag.emoji) || ""} ${d.country}`, region: d.region, city: d.city,
               isp: c.isp, org: c.org, asn: c.asn && "AS" + c.asn, tz: d.timezone && d.timezone.id }; },
    async () => { const d = JSON.parse(await fetchText(`https://ipapi.co/${ip}/json/`)); if (d.error) throw 0;
      return { country: d.country_name, region: d.region, city: d.city, isp: d.org, asn: d.asn, tz: d.timezone }; },
    async () => { const d = JSON.parse(await fetchText(`https://get.geojs.io/v1/ip/geo/${ip}.json`));
      return { country: d.country, region: d.region, city: d.city, isp: d.organization_name,
               asn: d.asn && "AS" + d.asn, tz: d.timezone }; },
  ];
  for (const s of sources) { try { return await s(); } catch (e) { /* следующий */ } }
  return null;
}

async function main() {
  // Первый успешный ответ из всех сервисов (обычно IPv6, если он есть, иначе IPv4)
  let any;
  try { any = await Promise.any(PROVIDERS.map(ask)); } catch (e) { any = null; }

  if (any && any.includes(":")) {
    result.ipv6 = any;
    try { result.ipv4 = await Promise.any(V4_ONLY.map(ask)); } catch (e) { /* только IPv6 */ }
  } else if (any) {
    result.ipv4 = any;
  }

  const primary = result.ipv4 || result.ipv6;
  const ip4El = document.getElementById("ip4");
  if (!primary) {
    ip4El.innerHTML = '<span class="err">Не удалось определить IP</span>';
    document.getElementById("ip6").innerHTML =
      "Все сервисы определения IP недоступны с этого устройства. Частая причина — блокировка " +
      "трекеров/рекламы во VPN (например, NetShield в Proton VPN) или фильтр в DNS. " +
      "Попробуйте временно отключить блокировку и открыть приложение снова.<br><br>" +
      "<small>" + failures.map(f => f.replace(/[<>&]/g, "")).join("<br>") + "</small>";
    return;
  }
  ip4El.textContent = primary;
  document.getElementById("ip6").textContent =
    result.ipv4 && result.ipv6 ? "IPv6: " + result.ipv6 : (result.ipv6 ? "IPv6" : "IPv4");

  // Отправка в бота доступна сразу, не дожидаясь сводки
  // platform === "unknown" — страница открыта в обычном браузере, а не в Telegram
  if (tg && tg.platform && tg.platform !== "unknown") {
    const btn = document.getElementById("send");
    btn.style.display = "block";
    btn.onclick = () => tg.sendData(JSON.stringify(result));
  }

  const d = await geoSummary(primary);
  if (d) {
    const box = document.getElementById("details");
    box.innerHTML =
      row("Страна", d.country) + row("Регион", d.region) + row("Город", d.city) +
      row("Провайдер", d.isp) + row("Организация", d.org !== d.isp ? d.org : "") +
      row("ASN", d.asn) + row("Часовой пояс", d.tz);
    box.style.display = "block";
  }
}

main();
</script>
</body>
</html>
